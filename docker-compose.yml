version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: uploadbox-db
    environment:
      POSTGRES_USER: uploadbox
      POSTGRES_PASSWORD: uploadbox
      POSTGRES_DB: uploadbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uploadbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uploadbox-backend
    environment:
      DATABASE_URL: postgresql://uploadbox:uploadbox@postgres:5432/uploadbox
      STORAGE_PATH: /app/storage
      PORT: "3000"
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: change-me-in-production
      MAX_FILE_SIZE: "5368709120"
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uploadbox-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  file_storage:
